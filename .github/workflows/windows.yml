name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDISKPRO_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Configure static analysis
        run: cmake -S . -B build-analyze -G Ninja -DCMAKE_BUILD_TYPE=Release -DDISKPRO_BUILD_GUI=OFF -DCMAKE_CXX_FLAGS=/analyze
      - name: Build with MSVC Code Analysis
        run: cmake --build build-analyze --parallel
